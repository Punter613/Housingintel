<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Add a rental lead · HousingIntel</title><style>body{background:#101827;color:#f2f5fc;font:16px system-ui;margin:0}main{max-width:560px;margin:auto;padding:20px}label{display:block;margin-top:13px}input,textarea,select,button{box-sizing:border-box;width:100%;padding:12px;border-radius:8px;margin-top:5px;font:inherit}input,textarea,select{background:#1b2940;color:white;border:1px solid #65758b}button{background:#b4f0ce;color:#11261c;border:0;font-weight:700;margin-top:20px}p{line-height:1.5;color:#bfcee1}a{color:#b4f0ce}</style></head><body><main><h1>Add a rental lead</h1><p>Found a rental? Share the basic listing details. No account, JSON, or import token required. Submissions wait for review and do not appear automatically in search results.</p><form id="f"><label>Listing link<input name="source_url" type="url" required placeholder="https://..."></label><label>Source<select name="source"><option value="manual_other">Other / Facebook / Craigslist</option><option value="ohio_housing_locator">Ohio Housing Locator</option><option value="affordablehousing">AffordableHousing.com</option><option value="tmha">TMHA</option><option value="zillow">Zillow</option><option value="apartments">Apartments.com</option></select></label><label>Street address<input name="address" required></label><label>City<input name="city" required placeholder="Warren"></label><label>Ohio ZIP<input name="zip" required inputmode="numeric" pattern="[0-9]{5}"></label><label>Unit (optional)<input name="unit"></label><label>Bedrooms (optional)<input name="bedrooms" type="number" min="0" max="20" step=".5"></label><label>Advertised rent (optional)<input name="rent" type="number" min="0" max="100000" step=".01"></label><label>Listing notes (optional)<textarea name="evidenceNotes" rows="3"></textarea></label><label style="position:absolute;left:-9999px" aria-hidden="true">Website<input name="website" tabindex="-1" autocomplete="off"></label><button>Send lead for review</button></form><p id="status" role="status"></p><p>No names, SSNs, voucher documents, payment information, or private contact details. <a href="/">Back to rental search</a></p><script>document.getElementById('f').addEventListener('submit',async e=>{e.preventDefault();const f=e.currentTarget,s=document.getElementById('status');const data=Object.fromEntries(new FormData(f));for(const key of ['bedrooms','rent'])data[key]=data[key]===''?null:Number(data[key]);s.textContent='Sending…';try{const r=await fetch('/api/leads',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data),credentials:'omit'});const body=await r.json();if(!r.ok)throw Error(body.error||'Submission failed');s.textContent=body.duplicate?'This listing was already suggested.':'Thanks! Added to the pending-review queue.';f.reset();}catch(err){s.textContent=err.message;}});</script></main></body></html>
