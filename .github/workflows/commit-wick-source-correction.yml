name: MANUAL COMMIT - Wick Street source correction
on:
  workflow_dispatch:
    inputs:
      listing_id:
        description: 'Exact existing listing ID (listing_ + 32 lowercase hex characters)'
        required: true
        type: string
      source_url:
        description: 'Exact stored TMHA YouthBuild source URL'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: wick-source-commit-correction
  cancel-in-progress: false

jobs:
  commit-correction:
    name: Guarded single-record source correction
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout reviewed code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Commit guarded correction and emit in-transaction evidence
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          LISTING_ID: ${{ inputs.listing_id }}
          SOURCE_URL: ${{ inputs.source_url }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DATABASE_URL" || { echo "Missing DATABASE_URL secret"; exit 1; }
          node src/correct-wick-source.js --id "$LISTING_ID" --url "$SOURCE_URL" --commit
