name: DRY RUN ONLY - Wick Street source correction
on:
  workflow_dispatch:
    inputs:
      listing_id:
        description: 'Exact existing listing ID (listing_ + 32 lowercase hex characters)'
        required: true
        type: string
      source_url:
        description: 'Exact stored TMHA YouthBuild source URL'
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify-rollback:
    name: Read-only outcome - transaction always rolls back
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout reviewed code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Execute correction script in dry-run mode ONLY
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          LISTING_ID: ${{ inputs.listing_id }}
          SOURCE_URL: ${{ inputs.source_url }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DATABASE_URL" || { echo "Missing DATABASE_URL secret"; exit 1; }
          node src/correct-wick-source.js --id "$LISTING_ID" --url "$SOURCE_URL"
