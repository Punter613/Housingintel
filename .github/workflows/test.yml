name: HousingIntel tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test

  postgres-concurrency:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: housing_test
          POSTGRES_PASSWORD: housing_test_password
          POSTGRES_DB: housing_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U housing_test -d housing_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      HOUSING_TEST_DATABASE_URL: postgresql://housing_test:housing_test_password@localhost:5432/housing_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: node --test --test-reporter=tap integration/concurrency.integration.cjs
